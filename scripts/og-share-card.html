<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(135deg, #f4f7ff 0%, #eef2fb 45%, #e8eef9 100%);
        display: flex;
        overflow: hidden;
      }
      .photo-wrap {
        width: 420px;
        height: 630px;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .photo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }
      .content {
        flex: 1;
        padding: 64px 56px 64px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .eyebrow {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #4575e6;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 52px;
        line-height: 1.05;
        font-weight: 700;
        color: #141a2a;
        margin-bottom: 12px;
      }
      .role {
        font-size: 28px;
        font-weight: 600;
        color: #4575e6;
        margin-bottom: 24px;
      }
      p {
        font-size: 22px;
        line-height: 1.45;
        color: #3d4659;
        max-width: 640px;
      }
      .meta {
        margin-top: 28px;
        font-size: 18px;
        color: #5c667a;
      }
    </style>
  </head>
  <body>
    <div class="photo-wrap">
      <img id="photo" src="" alt="" />
    </div>
    <div class="content">
      <div class="eyebrow">Resume</div>
      <h1>Muaaz Vorajee</h1>
      <div class="role">IT Support Professional</div>
      <p>Level 1 support · Birmingham, UK · Open to IT opportunities</p>
      <div class="meta">07498 703277 · info@muaazvorajee.com</div>
    </div>
  </body>
</html>
